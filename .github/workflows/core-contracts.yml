name: Observatory Core contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Node contract tests
        run: npm test
      - name: Build installable tarball
        run: npm run build
      - name: Independent offline package fixture against built tarball
        env:
          OC_PACKAGE_ARTIFACT: ${{ github.workspace }}/dist/observatory-core-1.2.0.tgz
        run: npm run test:package
      - uses: actions/checkout@v4
        with:
          ref: cdb77310216744eeac38a676d16ea5f3d85b6af1
          path: .scratch/release-baseline
      - name: Reproducibility, upgrade, rollback and backup fixture
        env:
          OC_BASELINE_DIR: ${{ github.workspace }}/.scratch/release-baseline
        run: npm run test:release
      - name: Install JSON Schema validator
        run: python -m pip install -r requirements-schema-test.txt
      - name: Domain-neutral JSON Schema conformance
        run: python -m unittest discover -s tests -p 'test_core_schema.py'
